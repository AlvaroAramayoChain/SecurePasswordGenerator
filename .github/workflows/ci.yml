name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Run the GUI smoke tests without a display on every OS.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install package with the GUI extra
        run: python -m pip install -e ".[gui]" -r requirements-dev.txt

      - name: Diagnostics
        shell: bash
        run: |
          python --version
          python -m pip list | grep -i -E "pyside|shiboken"
          if [ -f /etc/os-release ]; then cat /etc/os-release
          elif command -v sw_vers >/dev/null; then sw_vers
          else uname -a; fi

      - name: Run tests (including offscreen GUI smoke tests)
        run: python -m pytest -v

  docker:
    name: Docker build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Run tests in container
        run: docker compose run --rm test
