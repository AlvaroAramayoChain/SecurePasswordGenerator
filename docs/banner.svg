<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Secure Password Generator</title>
  <desc id="desc">A glossy yellow Y2K-style padlock next to the project name and a blinking terminal prompt.</desc>
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
    .twinkle { animation: twinkle 2.4s ease-in-out infinite; }
    .twinkle.late { animation-delay: 1.2s; }
    .cursor { animation: blink 1.06s steps(1) infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .twinkle, .cursor { animation: none; }
      .shine { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1747D6"/>
      <stop offset="1" stop-color="#061452"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8B8"/>
      <stop offset="0.35" stop-color="#FFE640"/>
      <stop offset="0.7" stop-color="#FFD200"/>
      <stop offset="1" stop-color="#F0A800"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B86F00"/>
      <stop offset="0.35" stop-color="#FFF8B8"/>
      <stop offset="0.6" stop-color="#FFE640"/>
      <stop offset="1" stop-color="#B86F00"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Inside the body's dark outline, so the shine never lightens it. -->
    <clipPath id="body-clip">
      <rect x="65" y="107" width="130" height="98" rx="19"/>
    </clipPath>
  </defs>

  <!-- Panel -->
  <rect x="4" y="4" width="952" height="232" rx="26" fill="url(#panel)" stroke="#061452" stroke-width="6"/>
  <rect x="14" y="14" width="932" height="212" rx="18" fill="none" stroke="#4C82FF" stroke-width="2" opacity="0.6"/>

  <!-- Padlock -->
  <g class="pulse">
    <path d="M92 116 V80 A38 38 0 0 1 168 80 V116" fill="none" stroke="#2A1900" stroke-width="28" stroke-linecap="round"/>
    <path d="M92 116 V80 A38 38 0 0 1 168 80 V116" fill="none" stroke="url(#tube)" stroke-width="18" stroke-linecap="round"/>
    <path d="M86 86 A44 44 0 0 1 112 46" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <rect x="62" y="104" width="136" height="104" rx="22" fill="url(#gold)" stroke="#2A1900" stroke-width="5"/>
    <rect x="70" y="112" width="120" height="88" rx="16" fill="none" stroke="#F0A800" stroke-width="1.5"/>
    <path d="M76 150 V132 A16 16 0 0 1 92 116 H118" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <circle cx="130" cy="144" r="11" fill="#0A0A0A"/>
    <path d="M124 146 H136 L141 178 H119 Z" fill="#0A0A0A"/>
    <g clip-path="url(#body-clip)">
      <rect class="shine" x="-60" y="96" width="40" height="124" fill="url(#gloss)">
        <animate attributeName="x" values="-60;210;210" keyTimes="0;0.55;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Pixel sparkles -->
  <g fill="#FFFFFF">
    <path class="twinkle" d="M206 66 h4 v-6 h4 v6 h4 v4 h-4 v6 h-4 v-6 h-4 z"/>
    <path class="twinkle late" d="M44 176 h3 v-5 h3 v5 h3 v3 h-3 v5 h-3 v-5 h-3 z"/>
    <path class="twinkle late" d="M200 196 h3 v-4 h3 v4 h3 v3 h-3 v4 h-3 v-4 h-3 z"/>
  </g>

  <!-- Title and prompt -->
  <text x="246" y="110" font-family="'Courier New', Courier, monospace" font-size="46" font-weight="bold"
        fill="url(#gold)" stroke="#2A1900" stroke-width="2.5" paint-order="stroke"
        textLength="660" lengthAdjust="spacingAndGlyphs">Secure Password Generator</text>
  <text x="246" y="158" font-family="'Courier New', Courier, monospace" font-size="24"
        textLength="530" lengthAdjust="spacingAndGlyphs"><tspan fill="#46E86A">&gt;&gt;&gt; </tspan><tspan fill="#A8D8FF">random passwords, made securely</tspan></text>
  <rect class="cursor" x="786" y="138" width="14" height="24" fill="#3D8BFF"/>
  <text x="246" y="200" font-family="'Courier New', Courier, monospace" font-size="18" fill="#9DB9F2"
        textLength="470" lengthAdjust="spacingAndGlyphs">ES | EN  ·  Windows  ·  macOS  ·  Linux</text>
</svg>
